<!DOCTYPE html>
<html lang="en">
\<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <!-- Primary SEO -->
    <title>Pattern Hacker – Pattern Recognition Brain Game | ThunderQuiz</title>

    <meta
        name="description"
        content="Play Pattern Hacker, a challenging pattern recognition brain game by ThunderQuiz. Test your logic, observation, memory and problem-solving skills."
    >

    <meta name="robots" content="index, follow">
    <meta name="author" content="ThunderQuiz">

    <!-- Canonical -->
    <link
        rel="canonical"
        href="https://www.thunderquiz.com/pattern-hacker/"
    >

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta
        property="og:title"
        content="Pattern Hacker – Pattern Recognition Brain Game | ThunderQuiz"
    >
    <meta
        property="og:description"
        content="Challenge your brain with Pattern Hacker. Test your pattern recognition, logic, memory and problem-solving skills."
    >
    <meta
        property="og:url"
        content="https://www.thunderquiz.com/pattern-hacker/"
    >
    <meta property="og:site_name" content="ThunderQuiz">
    <meta
        property="og:image"
        content="https://www.thunderquiz.com/images/pattern-hacker.jpg"
    >
    <meta
        property="og:image:alt"
        content="Pattern Hacker brain game by ThunderQuiz"
    >

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image">
    <meta
        name="twitter:title"
        content="Pattern Hacker – Pattern Recognition Brain Game | ThunderQuiz"
    >
    <meta
        name="twitter:description"
        content="Test your pattern recognition and problem-solving skills with Pattern Hacker on ThunderQuiz."
    >
    <meta
        name="twitter:image"
        content="https://www.thunderquiz.com/images/pattern-hacker.jpg"
    >

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="game-container">

        <header class="game-header">

            <a href="../../index.html" class="back-button">
                ← ThunderQuiz
            </a>

            <h1>Pattern Hacker</h1>

            <p>
                Crack the pattern before time runs out.
            </p>

        </header>

        <section class="game-panel">

            <div class="top-bar">

                <span id="question-number">
                    Challenge 1 / 10
                </span>

                <span id="timer">
                    15
                </span>

            </div>

            <div class="progress">
                <div id="progress-fill"></div>
            </div>

            <div class="challenge">

                <div id="pattern" class="pattern">
                </div>

                <p class="instruction">
                    What comes next?
                </p>

                <div id="answers" class="answers">
                </div>

            </div>

        </section>

        <section id="result" class="result hidden">

            <h2>Pattern Hacker</h2>

            <div class="final-score">
                <span id="score">0</span>
                <small>/ 10</small>
            </div>

            <p id="result-message">
                Challenge complete.
            </p>

            <button id="restart-button">
                Play Again
            </button>

            <a href="../../index.html" class="home-button">
                Back to Games
            </a>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
