<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Word Lock - Crack the word before the lock closes."
    >

    <title>Word Lock 🔐</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

<main id="game">

    <!-- HEADER -->

    <header class="topbar">

        <div class="logo-area">

            <div class="lock-icon">
                🔐
            </div>

            <div>
                <h1>Word Lock</h1>
                <p>Crack the word. Open the lock.</p>
            </div>

        </div>


        <div class="stats">

            <div class="stat">
                <span>LEVEL</span>
                <strong id="level">1</strong>
            </div>

            <div class="stat">
                <span>SCORE</span>
                <strong id="score">0</strong>
            </div>

            <div class="stat">
                <span>STREAK</span>
                <strong id="streak">0 🔥</strong>
            </div>

        </div>

    </header>


    <!-- PROGRESS -->

    <section class="progress-area">

        <div class="progress-text">

            <span id="attemptText">
                Attempts: 0 / 6
            </span>

            <span id="hintCount">
                💡 3
            </span>

        </div>

        <div class="progress-track">

            <div
                id="progressBar"
                class="progress-bar"
            ></div>

        </div>

    </section>


    <!-- LOCK -->

    <section class="lock-card">

        <div class="lock-top">

            <div class="lock-shackle"></div>

            <div class="lock-body">

                <div class="keyhole">
                    🔑
                </div>

            </div>

        </div>


        <div
            id="lockStatus"
            class="lock-status"
        >
            LOCKED
        </div>

    </section>


    <!-- CLUE -->

    <section class="clue-card">

        <div class="clue-label">
            CLUE
        </div>

        <h2 id="clue">
            Loading clue...
        </h2>

        <div
            id="wordLength"
            class="word-length"
        >
            4 LETTERS
        </div>

    </section>


    <!-- WORD GRID -->

    <section
        id="wordGrid"
        class="word-grid"
    >
        <!-- Generated by JavaScript -->
    </section>


    <!-- KEYBOARD -->

    <section
        id="keyboard"
        class="keyboard"
    >
        <!-- Generated by JavaScript -->
    </section>


    <!-- CONTROLS -->

    <div class="controls">

        <button
            id="backspace"
            class="control-button"
            type="button"
        >
            ←
        </button>

        <button
            id="hintButton"
            class="hint-button"
            type="button"
        >
            💡 Hint
        </button>

        <button
            id="submitButton"
            class="submit-button"
            type="button"
        >
            UNLOCK
        </button>

    </div>


    <!-- MESSAGE -->

    <div
        id="message"
        class="message"
    ></div>


    <!-- LEVEL COMPLETE -->

    <section
        id="completeScreen"
        class="complete-screen hidden"
    >

        <div class="complete-icon">
            🔓
        </div>

        <h2>
            LOCK OPEN!
        </h2>

        <p id="completeMessage">
            Excellent work.
        </p>

        <div
            id="levelScore"
            class="level-score"
        >
            +100
        </div>

        <button
            id="nextButton"
            class="next-button"
            type="button"
        >
            NEXT LEVEL →
        </button>

    </section>


    <!-- FOOTER -->

    <footer>
        Word Lock • Think carefully • Crack the code
    </footer>

</main>


<script
    src="script.js"
    defer
></script>

</body>
</html>
