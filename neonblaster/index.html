<body>

    <div class="game-wrapper">

        <!-- Header -->
        <header>
            <h1>NEON BLASTER</h1>
            <p>Destroy. Survive. Dominate.</p>
        </header>


        <!-- Game Information -->
        <div class="game-info">

            <div class="info-box">
                <span>SCORE</span>
                <strong id="score">0</strong>
            </div>

            <div class="info-box">
                <span>LIVES</span>
                <strong id="lives">❤️ ❤️ ❤️</strong>
            </div>

            <div class="info-box">
                <span>LEVEL</span>
                <strong id="level">1</strong>
            </div>

        </div>


        <!-- Game Canvas -->
        <div class="canvas-container">

            <canvas id="gameCanvas"></canvas>

            <!-- Start Screen -->
            <div id="startScreen" class="screen">

                <h2>READY TO BLAST?</h2>

                <p>
                    Move with ← → or A / D<br>
                    Press SPACE to shoot
                </p>

                <button id="startBtn">
                    START GAME 🚀
                </button>

            </div>


            <!-- Game Over Screen -->
            <div id="gameOverScreen" class="screen hidden">

                <h2>GAME OVER</h2>

                <p>
                    Final Score:
                    <strong id="finalScore">0</strong>
                </p>

                <button id="restartBtn">
                    PLAY AGAIN 🔥
                </button>

            </div>

        </div>

        <!-- Controls -->
        <div class="controls">

            <p>⌨️ Move: A / D or ← / →</p>

            <p>🔥 Shoot: SPACEBAR</p>

        </div>

    </div>


    <script src="script.js"></script>

</body>
